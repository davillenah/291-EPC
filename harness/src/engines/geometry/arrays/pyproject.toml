[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-arrays"
version = "0.1.0"
description = "EPC-291 geometry engine: the positions of the copies of a rectangular or polar array (luminaire grids, module tables, bolt circles); plan units, pure functions"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epc_arrays = ["schema/*.json"]
