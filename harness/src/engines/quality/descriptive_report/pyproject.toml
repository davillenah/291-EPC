[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-descriptive-report"
version = "0.1.0"
description = "EPC-291 quality engine: descriptive report (memoria descriptiva) of a board as a structured draft, built from the design basis and the circuit summary"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
