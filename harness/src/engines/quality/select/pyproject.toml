[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-select"
version = "0.1.0"
description = "EPC-291 quality engine: quick select, the records of a list that meet some conditions (equal, different, ordered, in a set, contains, exists); generic, no norm value"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epc_select = ["schema/*.json"]
