[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-feeder-sizing"
version = "0.1.0"
description = "EPC-291 calculation engine: feeder and circuit conductor sizing: conductor tables, ampacity, selection by section, thermal withstand and route lengths"
requires-python = ">=3.10"
dependencies = ["epc-calc-common", "epc-voltage-drop"]

[tool.setuptools.packages.find]
where = ["src"]
