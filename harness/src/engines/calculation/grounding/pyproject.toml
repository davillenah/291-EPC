[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-grounding"
version = "0.1.0"
description = "EPC-291 calculation engine: earthing: earth resistance, protective conductors, disconnection times and fault loops"
requires-python = ">=3.10"
dependencies = ["epc-calc-common", "epc-feeder-sizing"]

[tool.setuptools.packages.find]
where = ["src"]
