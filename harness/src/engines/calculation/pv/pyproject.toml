[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-pv"
version = "0.1.0"
description = "EPC-291 photovoltaic engine: hourly energy yield of a grid-connected array (sun position, plane-of-array irradiance, cell temperature, DC and AC power) and the string layout against the inverter limits"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
timezone = ["timezonefinder"]      # offline time zone of a place (`epc_pv.timezone`); without it the person types the offset

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epc_pv = ["data/*.json", "data/*/*.json", "data/*/*/*.json", "schema/*.json"]
