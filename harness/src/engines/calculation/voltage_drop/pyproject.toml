[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-voltage-drop"
version = "0.1.0"
description = "EPC-291 calculation engine: voltage drop of a circuit by the moment method, limits and maximum length"
requires-python = ">=3.10"
dependencies = ["epc-calc-common"]

[tool.setuptools.packages.find]
where = ["src"]
