[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-calc-common"
version = "0.1.0"
description = "EPC-291 calculation engine: shared infrastructure of the calculation engines: the norm-data loader, the norm tables, the protection parameters, argument validation, number formatting and rounding"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
