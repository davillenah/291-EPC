[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-load-balance"
version = "0.1.0"
description = "EPC-291 calculation engine: load balance: demand and design current of loads and boards, load current, phase balance and the project system voltage (U0)"
requires-python = ">=3.10"
dependencies = ["epc-calc-common"]

[tool.setuptools.packages.find]
where = ["src"]
