[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-transformer-sizing"
version = "0.1.0"
description = "EPC-291 calculation engine: transformer sizing: required apparent power, standard rating selection, loading and rated current"
requires-python = ">=3.10"
dependencies = ["epc-short-circuit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epc_transformer_sizing = ["data/*.json", "norm_register/*.json"]
