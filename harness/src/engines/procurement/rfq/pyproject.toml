[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-rfq"
version = "0.1.0"
description = "EPC-291 procurement engine: draft request for quotation (pedido de cotizacion) built from the bill of quantities and the datasheets; the explicit commercial terms are the caller's, supplier response fields stay empty, no price is ever set"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
