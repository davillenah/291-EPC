[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-mld"
version = "0.1.0"
description = "Door to the multi-line diagram generator that moved into epc_draw.mld (ADR-0042)"
requires-python = ">=3.10"
dependencies = ["epc-draw"]

[tool.setuptools.packages.find]
where = ["src"]
