<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26.0 -1.6 52.0 23.2" width="52.0mm" height="23.2mm" role="img" aria-label="Optimizador de potencia FV">
  <title>Optimizador de potencia FV</title>
  <desc>Placeholder block: a box with the device name until the real IEC 60617 symbol exists. | Bloque provisorio: caja con el nombre del dispositivo hasta que exista el símbolo IEC 60617 real.</desc>
  <g id="lv_pv_power_optimizer" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-12.0" y="2.5" width="24.0" height="15.0" stroke="#0000ff" stroke-width="0.25" />
    <text x="0" y="10.9" font-size="2.5" fill="#0000ff" text-anchor="middle">OPTIM</text>
    <line x1="0" y1="17.5" x2="0" y2="20.0" stroke="#0000ff" stroke-width="0.25" />
  </g>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="0" cy="20.0" r="0.6" data-dir="down" />
  </g>
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-X1" x="-14.0" y="10.0" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
  </g>
</svg>
