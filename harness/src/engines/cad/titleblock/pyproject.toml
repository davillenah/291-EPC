[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-titleblock"
version = "0.1.0"
description = "Door to the IRAM sheets and title blocks that moved into epc_draw.titleblock (ADR-0042)"
requires-python = ">=3.10"
dependencies = ["epc-draw"]

[tool.setuptools.packages.find]
where = ["src"]
