[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-symbols"
version = "0.1.0"
description = "Door to the IEC 60617 symbol library that moved into epc_draw.symbols (ADR-0042)"
requires-python = ">=3.10"
dependencies = ["epc-draw"]

[tool.setuptools.packages.find]
where = ["src"]
