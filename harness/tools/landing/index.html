<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPC-291 Harness</title>
<style>
:root{--bg:#f2f2f2;--panel:#fafafa;--ink:#2b2b2b;--mute:#7a7a7a;--line:#d6d6d6;--acc:#2e7d4f;--acc-ink:#fff;--ok:#2e7d4f;--bad:#555;--r:4px}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1c;--panel:#242424;--ink:#dcdcdc;--mute:#8d8d8d;--line:#3a3a3a;--acc:#3f9b66;--acc-ink:#fff;--ok:#5cb985;--bad:#bdbdbd}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:12.5px/1.35 Arial,Tahoma,sans-serif;display:grid;grid-template-rows:auto 1fr;gap:12px;padding:14px 18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}h1 small{color:var(--mute);font-weight:400;font-size:12px;margin-left:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lang button{border:0;background:transparent;color:var(--mute);padding:5px 10px;cursor:pointer;font:inherit}
.lang button.on{background:var(--acc);color:var(--acc-ink)}
main{display:grid;grid-template-columns:minmax(260px,32%) 1fr;gap:14px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;min-height:0}
label.t{font-size:12px;font-weight:600;color:var(--mute);margin-bottom:5px;display:block}
textarea{flex:1;min-height:0;resize:none;width:100%;border:1px solid var(--line);border-radius:var(--r);padding:10px;background:transparent;color:var(--ink);font:inherit}
.drop{margin-top:10px;border:1px dashed var(--line);border-radius:var(--r);padding:8px 10px;color:var(--mute);cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:11.5px}.drop.over{border-color:var(--acc);color:var(--ink)}.drop span:last-child{color:var(--ink);white-space:nowrap}
.fold{margin-bottom:10px}.fold input{font-family:Consolas,monospace;font-size:12px}
.seg{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;column-gap:14px}.seg .chead{grid-column:1/-1}.ck{padding:4px 2px}.ck small{display:none}.ck.all{grid-column:1/-1}.f.fold span{font-size:10.5px}
textarea{min-height:60px}.chead{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.ck{position:relative;display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:8px;padding:7px 4px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.ck input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}.ck svg{pointer-events:none;width:18px;height:18px}.ck .bx{fill:none;stroke:var(--mute);stroke-width:1.4}.ck .tk{fill:none;stroke:var(--acc-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck.on .bx{fill:var(--acc);stroke:var(--acc)}.ck.on .tk{opacity:1}.ck input:focus-visible~svg{outline:2px solid var(--acc);outline-offset:2px}.ck small{color:var(--mute);font-size:10.5px}.ck.all{font-weight:600}
.empty{grid-column:1/-1;color:var(--mute);margin:auto;text-align:center}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}.sec{animation:in .22s ease-out}
.form{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:10px}.form .sec:first-child{grid-column:1/-1}.form .sec:only-child{grid-column:1/-1}
.sec{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.sec h3{margin:0 0 6px;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;display:flex;gap:8px;align-items:center}
.badge{font-size:10px;text-transform:none;letter-spacing:0;border:1px solid var(--line);border-radius:var(--r);padding:0 7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px}
.grid.tight{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.f{display:flex;flex-direction:column;gap:2px;min-width:0}.f span{font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f span b{color:var(--mute)}
input,select{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:5px 7px;background:transparent;color:var(--ink);font:inherit;min-width:0}
.f.err input,.f.err select{border-color:var(--ink);background:var(--line)}
.pair{display:grid;grid-template-columns:1fr 38px;gap:4px}.pair i{align-self:center;color:var(--mute);font-style:normal;font-size:12px}
.rooms{display:grid;grid-template-columns:.8fr 1.6fr repeat(4,.6fr);gap:4px}.rooms .h{font-size:10px;color:var(--mute)}
.rooms button,.add{border:1px dashed var(--line);background:transparent;color:var(--mute);border-radius:var(--r);cursor:pointer;font:inherit;padding:3px}
.bar{display:flex;gap:10px;align-items:center;margin-top:12px}
.go{background:var(--acc);color:var(--acc-ink);border:1px solid var(--acc);border-radius:var(--r);padding:7px 16px;font:inherit;font-weight:600;cursor:pointer}.go:hover,.seg button:hover:not(.on){filter:brightness(1.08)}
.go.alt{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.msg{font-size:12px;color:var(--mute);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}.msg.ok{color:var(--ok)}.msg.bad{color:var(--ink);font-weight:600}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:140px 1fr}}
</style>
</head>
<body>
<header><h1>EPC-291 <small id="sub"></small></h1><div class="lang"><button data-l="es" class="on">ES</button><button data-l="en">EN</button></div></header>
<main>
  <section class="card"><label class="t" id="reqL" for="req"></label><textarea id="req"></textarea><label class="drop" id="drop"><input type="file" id="files" multiple hidden><span id="dropT"></span><span id="dropL"></span></label><div class="seg" id="seg"></div></section>
  <section class="card">
    <label class="f fold"><span id="foldL"></span><input id="folder" autocomplete="off"></label><div class="form" id="form"></div>
    <div class="bar"><button class="go alt" id="check"></button><button class="go" id="send"></button><div class="msg" id="msg"></div></div>
  </section>
</main>
<script>
const T={es:{sub:"Pedí lo que necesitás; el formulario se arma solo",req:"¿Qué querés hacer?",ph:"Describí el proyecto o lo que necesitás del harness…",electrical:"Eléctrico",architectural:"Arquitectónico",civil:"Civil y estructural",electrical_mv:"Eléctrico MT",mechanical:"Mecánico",hvac:"HVAC",piping:"Cañerías y sanitario",fire:"Protección contra incendio",instrumentation:"Instrumentación y control",telecom:"Telecomunicaciones",all:"Todas",folder:"Carpeta del proyecto",folderph:"E:\\00_Empresa\\CODIGO-DEL-PROYECTO",folderh:"La última carpeta es el código del proyecto.",docs:"Documentación",docsh:"Arrastrá archivos acá o hacé clic",files:"archivo(s)",discs:"Disciplinas",none:"Marcá una disciplina y su formulario aparece acá.",check:"Validar",send:"Enviar",
 st:{available:"disponible",partial:"parcial",planned:"planificada"},
 scope:"Alcance / qué se necesita",err:{inside_repo:"La carpeta no puede estar dentro del repositorio.",no_discipline:"Marcá al menos una disciplina."},plan:"Sin motor ni intake todavía: la solicitud se guarda, no se calcula.",ok:"Datos válidos.",created:"Proyecto creado (modo edición, datos sin verificar).",saved:"Guardado; esta disciplina aún no tiene pipeline.",fail:"No se pudo completar:",
 sec:{electrical:"Eléctrico (BT)",architectural:"Arquitectónico",civil:"Civil y estructural"},
 L:{project_code:"Código de proyecto","client.name":"Cliente","client.contact":"Contacto","site.address":"Dirección","site.country":"País (2 letras)","site.installation_type":"Tipo de instalación","supply.source":"Fuente","supply.voltage.value":"Tensión","supply.earthing_system":"Esquema de puesta a tierra","supply.short_circuit_level.value":"Nivel de cortocircuito","supply.short_circuit_level.origin":"Origen del dato de Icc","criteria.set":"Criterios","criteria.exceptions":"Excepciones (coma)","engineer_of_record.name":"Ingeniero responsable","engineer_of_record.registration":"Matrícula","engineer_of_record.college":"Colegio","language":"Idioma de entregables","floor.name":"Planta (nombre)","floor.index":"Nivel (0 = PB)","floor.wall_thickness_m":"Espesor de muro (m)","floor.rooms":"Locales (cajas en m: O, S, E, N)","civil.scope":"Alcance","civil.standard":"Norma",code:"Código",name:"Nombre",west:"O",south:"S",east:"E",north:"N",foundations:"Fundaciones",reinforced_concrete:"Hormigón armado",steel:"Acero",geotechnics:"Geotecnia"},add:"+ local"},
en:{sub:"Ask for what you need; the form builds itself",req:"What do you want to do?",ph:"Describe the project or what you need from the harness…",electrical:"Electrical",architectural:"Architectural",civil:"Civil & structural",electrical_mv:"Electrical MV",mechanical:"Mechanical",hvac:"HVAC",piping:"Piping & plumbing",fire:"Fire protection",instrumentation:"Instrumentation & control",telecom:"Telecommunications",all:"All",folder:"Project folder",folderph:"E:\\00_Company\\PROJECT-CODE",folderh:"The last folder is the project code.",docs:"Documentation",docsh:"Drop files here or click",files:"file(s)",discs:"Disciplines",none:"Tick a discipline and its form appears here.",check:"Validate",send:"Submit",
 st:{available:"available",partial:"partial",planned:"planned"},
 scope:"Scope / what is needed",err:{inside_repo:"The folder cannot be inside the repository.",no_discipline:"Tick at least one discipline."},plan:"No engine or intake yet: the request is saved, nothing is calculated.",ok:"Data is valid.",created:"Project created (edit mode, unverified data).",saved:"Saved; this discipline has no pipeline yet.",fail:"Could not complete:",
 sec:{electrical:"Electrical (LV)",architectural:"Architectural",civil:"Civil & structural"},
 L:{project_code:"Project code","client.name":"Client","client.contact":"Contact","site.address":"Address","site.country":"Country (2 letters)","site.installation_type":"Installation type","supply.source":"Source","supply.voltage.value":"Voltage","supply.earthing_system":"Earthing scheme","supply.short_circuit_level.value":"Short-circuit level","supply.short_circuit_level.origin":"Short-circuit origin","criteria.set":"Criteria set","criteria.exceptions":"Exceptions (comma)","engineer_of_record.name":"Engineer of record","engineer_of_record.registration":"Registration","engineer_of_record.college":"College","language":"Deliverables language","floor.name":"Floor (name)","floor.index":"Level (0 = ground)","floor.wall_thickness_m":"Wall thickness (m)","floor.rooms":"Rooms (boxes in m: W, S, E, N)","civil.scope":"Scope","civil.standard":"Standard",code:"Code",name:"Name",west:"W",south:"S",east:"E",north:"N",foundations:"Foundations",reinforced_concrete:"Reinforced concrete",steel:"Steel",geotechnics:"Geotechnics"},add:"+ room"}};
let lang="es",disc=[],docs=[],forms=[],vals={},errs=[];
const $=s=>document.querySelector(s),t=()=>T[lang];
const lab=k=>t().L[k]||(k.endsWith(".scope")?t().scope:k.endsWith(".standard")?t().L["civil.standard"]:k);
async function load(){if(!disc.length){forms=[];return draw()}const r=await (await fetch("/api/form?discipline="+disc.join(","))).json();forms=r.forms;draw()}
function field(f){
  const star=f.required?" <b>*</b>":"",bad=errs.some(e=>e.startsWith(f.path))?" err":"";
  if(f.kind==="unit")return"";
  const v=vals[f.path]??(f.path==="language"?lang:"");let inp;
  if(f.kind==="select")inp=`<select data-p="${f.path}"><option value=""></option>${f.options.map(o=>`<option value="${o}" ${v==o?"selected":""}>${t().L[o]||o}</option>`).join("")}</select>`;
  else if(f.kind==="rooms")return rooms(f);
  else inp=`<input data-p="${f.path}" value="${String(v).replace(/"/g,"&quot;")}" ${f.kind==="number"?'inputmode="decimal"':""}>`;
  const unit=f.path==="supply.voltage.value"?"V":f.path==="supply.short_circuit_level.value"?"kA":"";
  return`<label class="f${bad}"><span title="${lab(f.path)}">${lab(f.path)}${star}</span>${unit?`<div class="pair">${inp}<i>${unit}</i></div>`:inp}</label>`}
function rooms(f){
  const rs=vals[f.path]||(vals[f.path]=[{}]),c=f.columns;
  return`<div class="f" style="grid-column:1/-1"><span>${lab(f.path)} <b>*</b></span><div class="rooms">${c.map(k=>`<div class="h">${lab(k)}</div>`).join("")}${rs.map((r,i)=>c.map(k=>`<input data-r="${i}" data-k="${k}" value="${r[k]??""}">`).join("")).join("")}</div><button class="add" id="addroom">${t().add}</button></div>`}
function draw(){
  const ALL=["architectural","civil","electrical","electrical_mv","mechanical","hvac","piping","fire","instrumentation","telecom"],stt=d=>({electrical:"available",architectural:"partial"})[d]||"planned";
  const svg='<svg viewBox="0 0 18 18"><rect class="bx" x="1.5" y="1.5" width="15" height="15" rx="3"/><path class="tk" d="M5 9.5l2.8 2.8L13 6.2"/></svg>';
  const row=(id,on,txt,sm,att)=>`<label class="ck ${on?"on":""} ${id==="all"?"all":""}"><input type="checkbox" ${att} ${on?"checked":""}>${svg}<span>${txt}</span><small>${sm}</small></label>`;
  $("#seg").innerHTML=`<div class="chead"><span>${t().discs}</span><span>${disc.length} / ${ALL.length}</span></div>`+ALL.map(d=>row(d,disc.includes(d),t()[d],t().st[stt(d)],`data-d="${d}"`)).join("")+row("all",disc.length===ALL.length,t().all,"",'id="allc"');
  $("#form").innerHTML=!forms.length?`<div class="empty">${t().none}</div>`:forms.map(fm=>`<div class="sec"><h3>${t().sec[fm.id]||t()[fm.id]}<span class="badge">${t().st[fm.status]}</span></h3><div class="grid ${forms.length>1?"tight":""}">${fm.fields.map(field).join("")}</div></div>`).join("");
  $("#sub").textContent=t().sub;$("#foldL").textContent=t().folder;$("#folder").placeholder=t().folderph;$("#folder").title=t().folderh;$("#dropT").textContent=t().docs+" · "+t().docsh;$("#dropL").textContent=docs.length?docs.length+" "+t().files:"";$("#reqL").textContent=t().req;$("#req").placeholder=t().ph;$("#check").textContent=t().check;$("#send").textContent=t().send;document.documentElement.lang=lang;
  document.querySelectorAll("[data-d]").forEach(b=>b.onchange=()=>{const d=b.dataset.d,on=disc.includes(d);disc=ALL.filter(x=>x===d?!on:disc.includes(x));errs=[];load()});
  $("#allc").onchange=()=>{disc=disc.length===ALL.length?[]:[...ALL];errs=[];load()};
  document.querySelectorAll("[data-p]").forEach(i=>i.oninput=()=>vals[i.dataset.p]=i.value);
  document.querySelectorAll("[data-r]").forEach(i=>i.oninput=()=>{const p="floor.rooms";vals[p][i.dataset.r][i.dataset.k]=i.value});
  const a=$("#addroom");if(a)a.onclick=()=>{vals["floor.rooms"].push({});draw()}}
async function payload(){const a={...vals};a.language=a.language||lang;
  if(Array.isArray(a["floor.rooms"]))a["floor.rooms"]=a["floor.rooms"].filter(r=>Object.keys(r).length);
  const enc=await Promise.all(docs.map(f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r({name:f.name,data:x.result.split(",")[1]});x.readAsDataURL(f)})));
  return{discipline:disc,request:$("#req").value,folder:$("#folder").value,docs:enc,answers:a}}
function say(s,c){const m=$("#msg");m.textContent=s;m.className="msg "+(c||"");m.title=s}
async function post(u){if(!disc.length)return say(t().none,"bad");say("…");const r=await (await fetch(u,{method:"POST",body:JSON.stringify(await payload())})).json();
  errs=[];let bad=[],last="ok";if(r.error)return say(t().err[r.error],"bad");
  for(const [d,x] of Object.entries(r.results)){if(x.errors?.length){errs.push(...x.errors);bad.push(x.errors[0])}else if(x.state==="failed"){bad.push(t().fail+" "+(x.detail?.error?.message||""))}else if(last!=="created")last=x.state}
  draw();
  if(bad.length)return say(bad[0]+(bad.length>1?` (+${bad.length-1})`:""),"bad");
  say(t()[last==="valid"?"ok":last]||t().ok,"ok")}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.querySelectorAll(".lang button").forEach(x=>x.classList.toggle("on",x===b));draw()});
$("#check").onclick=()=>post("/api/check");$("#send").onclick=()=>post("/api/submit");
const fi=$("#files"),dz=$("#drop");
const addFiles=fl=>{[...fl].forEach(f=>{if(!docs.some(d=>d.name===f.name))docs.push(f)});$("#dropL").textContent=docs.length+" "+t().files;dz.title=docs.map(d=>d.name).join("\n")};
dz.onclick=e=>{if(e.target!==fi)fi.click()};fi.onchange=()=>{addFiles(fi.files);fi.value=""};
dz.ondragover=e=>{e.preventDefault();dz.classList.add("over")};dz.ondragleave=()=>dz.classList.remove("over");dz.ondrop=e=>{e.preventDefault();dz.classList.remove("over");addFiles(e.dataTransfer.files)};
$("#folder").oninput=e=>{const n=e.target.value.trim().replace(/[\\/]+$/,"").split(/[\\/]/).pop();if(n&&!vals.project_code_touched){vals.project_code=n;const i=document.querySelector('[data-p="project_code"]');if(i)i.value=n}};
document.addEventListener("input",e=>{if(e.target.dataset&&e.target.dataset.p==="project_code")vals.project_code_touched=true});
load();
</script>
</body>
</html>
